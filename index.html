<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Julio Santana</title>
<style>
 body{font-family:Arial;margin:0;background:#f0f4f8}
 .box{max-width:800px;margin:20px auto;background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12)}
 .topo{background:linear-gradient(135deg,#0a66c2,#004182);color:white;padding:40px;text-align:center}
 .foto{width:160px;height:160px;border-radius:50%;border:5px solid white;object-fit:cover}
 .conteudo{padding:30px}
 .jogo{background:#fffbe6;border:2px dashed #ffb700;padding:20px;border-radius:15px;text-align:center;margin-top:20px}
 .jogo-foto{width:100px;height:100px;border-radius:50%;cursor:pointer;border:3px solid #ffb700}
 .placar{font-size:32px;font-weight:bold;color:#0a66c2}
 .btn{display:block;background:#25D366;color:white;text-align:center;padding:16px;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<div class="topo"><img src="foto.jpg" class="foto"><h1>Julio Santana</h1><p>Itaúna-MG | (37) 99803-9408</p></div>
<div class="conteudo">
<p>Sou dedicado, aprendo rápido e busco oportunidade em tecnologia.</p>
<div class="jogo">
<h2>🎮 JOGUINHO DO JULIÃO</h2>
<p>Quantos cliques na minha cara em 5 segundos?</p>
<p class="placar" id="placar">0</p>
<img src="foto.jpg" class="jogo-foto" id="jogoFoto" onclick="clique()">
<p><button onclick="iniciar()" style="padding:10px 20px;background:#0a66c2;color:white;border:none;border-radius:8px;font-weight:bold">COMEÇAR</button></p>
<p id="tempo">Clique em COMEÇAR!</p>
</div>
<a class="btn" href="https://wa.me/5537998039408">💬 Meu WhatsApp</a>
</div></div>
<script>
let pontos=0,tempo=5,jogando=false,timer;
function iniciar(){pontos=0;tempo=5;jogando=true;document.getElementById('placar').innerText=0;document.getElementById('tempo').innerText='Vai! 5s';timer=setInterval(()=>{tempo--;document.getElementById('tempo').innerText=tempo+'s';if(tempo<=0){clearInterval(timer);jogando=false;document.getElementById('tempo').innerText='FIM! Fez '+pontos+' cliques!';}},1000);}
function clique(){if(jogando){pontos++;document.getElementById('placar').innerText=pontos;}}
</script>
</body>
</html>
